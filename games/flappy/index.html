<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Mode - Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        
        <!-- Top UI Bar -->
        <div class="top-bar">
            <a href="../../index.html" class="back-hub-btn">⟵ HOME</a>
            <div class="settings-icon" id="settings-icon">⚙️</div>
        </div>

        <!-- Sidebar Menu -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">SYSTEM MENU</div>
            <ul class="sidebar-list">
                <li class="active">Main Terminal</li>
                <li>Global Leaderboard</li>
                <li>Unlockables</li>
                <li>Diagnostics (Settings)</li>
                <li class="exit-btn" id="close-sidebar">EXIT MENU</li>
            </ul>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <h2>DIAGNOSTICS</h2>
                <div class="setting-row">
                    <span>Base Difficulty</span>
                    <select id="difficulty-select" class="styled-select">
                        <option value="easy" selected>Easy (Wider Gaps)</option>
                        <option value="medium">Standard</option>
                        <option value="hard">Hardcore</option>
                    </select>
                </div>
                <div class="setting-row">
                    <span>Particle Engine</span>
                    <label class="switch"><input type="checkbox" id="particle-toggle" checked><span class="slider"></span></label>
                </div>
                <button class="action-btn small glow-btn" id="close-settings">APPLY CHANGES</button>
            </div>
        </div>

        <!-- Game UI Overlay -->
        <div id="ui-layer">
            <h1 id="title">FLAPPY<span class="highlight">X</span></h1>
            
            <div class="score-board">
                <div class="score-box">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-box">
                    <span class="label">BEST</span>
                    <span id="high-score" class="value">0</span>
                </div>
            </div>
            
            <div id="start-screen" class="screen active modern-panel">
                <div class="logo-box">
                    <p class="subtitle">ENTER CODENAME TO BEGIN</p>
                </div>
                <div class="input-group">
                    <input type="text" id="player-name" placeholder="e.g. John" autocomplete="off" maxlength="12">
                </div>

                <div class="mode-selector">
                    <button class="mode-btn" data-mode="baby">NOOB (EASIEST)</button>
                    <button class="mode-btn active" data-mode="normal">NORMAL</button>
                    <button class="mode-btn" data-mode="fast">HYPER</button>
                    <button class="mode-btn" data-mode="moon">LUNAR</button>
                    <button class="mode-btn" data-mode="crazy">CHAOS</button>
                </div>
                <button id="start-btn" class="action-btn glow-btn">INITIALIZE</button>
            </div>

            <!-- Get Ready Screen -->
            <div id="ready-screen" class="screen">
                <h2 class="pulse-text">TAP TO START</h2>
            </div>

            <div id="game-over-screen" class="screen modern-panel">
                <h2 class="game-over-title">SYSTEM FAILURE</h2>
                <div id="king-banner" class="king-banner" style="display:none;"></div>
                <div class="joke-container">
                    <p id="name-joke" class="name-joke"></p>
                    <p id="funny-quote" class="funny-quote">"Gravity always wins."</p>
                </div>
                <div class="final-stats">
                    <p>SCORE: <span id="final-score">0</span></p>
                </div>
                <button id="restart-btn" class="action-btn glow-btn">REBOOT</button>
            </div>
        </div>

        <canvas id="game-canvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
